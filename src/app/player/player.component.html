<div class="flex flex-direction-row justify-content-center player-mobile-flex" [class.border-grey]="!playerOnly">

  <div [class.flex-direction-row]="playerOnly && !isMobile" [class.flex-direction-column]="!playerOnly || isMobile" class="flex">
    <seek-buttons
      class="flex justify-content-center" [class.m-small]="!playerOnly" [class.ml-small]="playerOnly"
      [playerIp]="playerIp"
      [fileUrl]="fileUrl"
      (seek)="onSeek($event)"
      (stop)="onStop()"
      (play)="onPlay()"
      (queuePlay)="onQueuePlay()"
      (trackRelative)="onTrackRelative($event)"
    ></seek-buttons>
    <div class="flex justify-content-center" [class.m-small]="!playerOnly" [class.ml-small]="playerOnly">
      <volume-control [volume]="volume" (onVolumeChange)="handleVolumeChange($event)"></volume-control>
    </div>

    <div id="song-title" class="flex justify-content-center song-title" [class.m-small]="!playerOnly" [class.ml-small]="playerOnly">
      <div>{{ track }} - {{ title }} - {{ position }}</div>
    </div>
  </div>

  @if (!playerOnly) {
    <bal-card [border]="false" [flat]="true">
      <!-- Queue ausgelagert in eigene Komponente -->
      <sonos-queue>
<!--        (playTrack)="onPlayTrack($event)"-->
<!--        (removeTrack)="onRemoveTrack($event)"-->
<!--        (queuePlay)="onQueuePlayItem($event)"-->
<!--        (clearQueue)="onClearQueue()"-->
      </sonos-queue>
    </bal-card>
  }
</div>
