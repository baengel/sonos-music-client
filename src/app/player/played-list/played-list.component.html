<bal-content class="mt-none bg-grey-2 played-list">
  <h3 >Played List</h3>
  @if (loading) {
    <div>Lade gespielt Titel...</div>
  } @else if (error) {
    <div class="error">{{ error }}</div>
  } @else {
    <ul>
      @for (item of playedSorted | async; track item) {
        <li (click)="onPlayItem(item)" class="played-item">
          {{ item.count }}x {{ item.title }} - {{ item.artist }}
        </li>
      }
    </ul>
  }
</bal-content>
